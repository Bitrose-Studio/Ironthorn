name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows (msvc + clang-cl + tidy)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      # The pinned CMake, Ninja, clang-format and clang-tidy, the same as on developer machines.
      - name: Bootstrap pinned tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Verify (format, MSVC Debug/dev/Release, clang-cl, clang-tidy)
        shell: pwsh
        run: ./scripts/dev.ps1 verify

  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-dev
            configure: linux-clang
          - preset: linux-clang-release
            configure: linux-clang
          - preset: linux-gcc-dev
            configure: linux-gcc
          - preset: linux-asan
            configure: linux-asan
          - preset: linux-tsan
            configure: linux-tsan
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      # The sanitizer runtimes of Clang 18 fail on the runner's high ASLR entropy.
      - name: Lower ASLR entropy for sanitizers
        if: contains(matrix.preset, 'san')
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.configure }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}
      # ADR-0014 rule 19: the ECS benchmark runs in CI and prints its numbers. It never fails on
      # them: shared runners are too noisy for a timing gate.
      - name: Benchmarks
        if: matrix.preset == 'linux-clang-release'
        run: ctest --test-dir build/${{ matrix.configure }} -C Release -L benchmark --verbose

  # ADR-0017 rule 4: the sample player and server build in Shipping without the editor and tools
  # modules, and the server also without the client modules, on a plain Ubuntu image with no
  # display packages. If either needed such a module, it would fail to configure or link.
  # The player leg proves little until the first client module exists; it will then need display
  # packages, while the server leg must stay without them.
  shipping-link:
    name: shipping link (${{ matrix.application }})
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [player, server]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure
        run: cmake --preset linux-shipping-${{ matrix.application }}
      - name: Build
        run: cmake --build --preset linux-shipping-${{ matrix.application }}
      - name: Run
        run: ./build/linux-shipping-${{ matrix.application }}/bin/Release/minimal_${{ matrix.application }}
