name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Development packages SDL needs at configure time to compile in its X11 and Wayland video drivers,
# IME, gamepad hotplug, HIDAPI's libusb backend and file dialog support on Linux (ADR-0012,
# docs/development/building.md).
# Jobs that build client modules install them; the dedicated server job must not.
env:
  DISPLAY_DEV_PACKAGES: >-
    pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl-dev libdecor-0-dev
    libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev

jobs:
  windows:
    name: windows (msvc + clang-cl + tidy)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        # The golden images of the GPU tests are stored with Git LFS.
        with:
          lfs: true
      # The pinned CMake, Ninja, clang-format and clang-tidy, the same as on developer machines.
      - name: Bootstrap pinned tools
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      # The Direct3D 12 debug layer needs the "Graphics Tools" optional feature. verify runs the
      # gpu-labelled rhi_d3d12 tests on WARP with validation on (ADR-0009 rule 18).
      - name: Install Graphics Tools (Direct3D 12 debug layer)
        shell: pwsh
        timeout-minutes: 20
        run: |
          Add-WindowsCapability -Online -Name "Tools.Graphics.DirectX~~~~0.0.1.0"
          if (-not (Test-Path "$env:WINDIR\System32\d3d12SDKLayers.dll")) { throw 'Graphics Tools did not install' }
      - name: Verify (format, MSVC Debug/dev/Release, clang-cl, clang-tidy, GPU tests on WARP)
        shell: pwsh
        run: ./scripts/dev.ps1 verify

  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-clang-dev
            configure: linux-clang
          - preset: linux-clang-release
            configure: linux-clang
          - preset: linux-gcc-dev
            configure: linux-gcc
          - preset: linux-asan
            configure: linux-asan
          - preset: linux-tsan
            configure: linux-tsan
    steps:
      - uses: actions/checkout@v4
        # The golden images of the GPU tests are stored with Git LFS.
        with:
          lfs: true
      # libclang-rt-18-dev holds the sanitizer runtimes and headers; the runner image has it, a
      # minimal Ubuntu doesn't.
      - name: Install build tools and display development packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev $DISPLAY_DEV_PACKAGES
      # Vulkan for the gpu-labelled rhi_vulkan tests: Mesa's lavapipe (CPU) driver and the system
      # loader from Ubuntu, and the Khronos validation layer from the pinned LunarG SDK, because
      # noble's vulkan-validationlayers (1.3.275) is too old for synchronization validation. Not
      # from apt as well: two layers of the same name on the search path would be ambiguous.
      - name: Install Vulkan driver and loader
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools xvfb xauth
          dpkg-query -W mesa-vulkan-drivers libvulkan1
      - name: Cache Vulkan validation layer
        id: vvl-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vvl
          key: vvl-linux-1.4.363.1-b7867d8c
      # Only the layer and its manifest, which finds the library at ../../../lib relative to itself.
      # Without debug information the layer is 40 MB instead of 411 MB.
      - name: Install Vulkan validation layer
        if: steps.vvl-cache.outputs.cache-hit != 'true'
        env:
          VULKAN_SDK_VERSION: 1.4.363.1
          VULKAN_SDK_SHA256: b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
        run: |
          archive="$RUNNER_TEMP/vulkansdk.tar.xz"
          curl -sSfL -o "$archive" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz"
          echo "$VULKAN_SDK_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vvl"
          tar -xJf "$archive" -C "$RUNNER_TEMP/vvl" --strip-components=2 \
            "$VULKAN_SDK_VERSION/x86_64/lib/libVkLayer_khronos_validation.so" \
            "$VULKAN_SDK_VERSION/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
          strip --strip-debug "$RUNNER_TEMP/vvl/lib/libVkLayer_khronos_validation.so"
          rm "$archive"
      # Fails unless the loader really loads the layer library, not only finds its manifest.
      - name: Show Vulkan device and check the validation layer
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ADD_LAYER_PATH: ${{ runner.temp }}/vvl/share/vulkan/explicit_layer.d
        run: |
          vulkaninfo --summary
          VK_LOADER_LAYERS_ENABLE='*validation' VK_LOADER_DEBUG=layer vulkaninfo --summary 2>&1 |
            grep -F 'Insert instance layer "VK_LAYER_KHRONOS_validation"'
      # The sanitizer runtimes of Clang 18 fail on the runner's high ASLR entropy.
      - name: Lower ASLR entropy for sanitizers
        if: contains(matrix.preset, 'san')
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.configure }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # TSAN_OPTIONS, with the suppressions file, comes from the linux-tsan test preset.
      # The Vulkan tests run on lavapipe only (VK_DRIVER_FILES; the package installs other drivers'
      # manifests too) with the validation layer, which they enable themselves outside Shipping.
      # ITH_RHI_TEST_REQUIRE_VULKAN=1 makes a missing device or layer a failure, not a skip.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ADD_LAYER_PATH: ${{ runner.temp }}/vvl/share/vulkan/explicit_layer.d
          ITH_RHI_TEST_REQUIRE_VULKAN: "1"
          ITH_RHI_TEST_ADAPTER: software
        run: ctest --preset ${{ matrix.preset }}
      # The Vulkan swapchain on a real X11 window (Xvfb) on lavapipe. window_player falls back to
      # running without rendering, so the step checks that it rendered with Vulkan.
      - name: Window player on Vulkan (X11)
        if: matrix.preset == 'linux-clang-dev' || matrix.preset == 'linux-gcc-dev'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          SDL_VIDEO_DRIVER: x11
        run: |
          set -o pipefail
          xvfb-run -a build/${{ matrix.configure }}/bin/RelWithDebInfo/window_player --backend vulkan --adapter software --frames 60 |
            tee /dev/stderr > window_player.log
          # Not `| grep -q`: with pipefail, tee would fail on the pipe grep closed after its match.
          grep -q "rendering with Vulkan" window_player.log
      # The 10,000 instanced cubes on the same window, through the bindless model; the step checks
      # that it rendered with Vulkan and printed its frame timings.
      - name: Scene player on Vulkan (X11)
        if: matrix.preset == 'linux-clang-dev' || matrix.preset == 'linux-gcc-dev'
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          SDL_VIDEO_DRIVER: x11
        run: |
          set -o pipefail
          xvfb-run -a build/${{ matrix.configure }}/bin/RelWithDebInfo/scene_player --backend vulkan --adapter software --frames 30 |
            tee /dev/stderr > scene_player.log
          grep -q "rendering with Vulkan" scene_player.log
          grep -q "frames of the 10,000 instanced cubes" scene_player.log
      # ADR-0014 rule 19: the ECS benchmark runs in CI and prints its numbers. It never fails on
      # them: shared runners are too noisy for a timing gate.
      - name: Benchmarks
        if: matrix.preset == 'linux-clang-release'
        run: ctest --test-dir build/${{ matrix.configure }} -C Release -L benchmark --verbose

  # ADR-0017 rule 4: the sample players and the server build in Shipping without the editor and
  # tools modules, and the server also without the client modules, in a plain Ubuntu container. If
  # either needed such a module, it would fail to configure or link. The player leg installs the
  # display development packages its client modules need; the server leg must build without them.
  # window_player runs headless on SDL's offscreen video driver.
  shipping-link:
    name: shipping link (${{ matrix.application }})
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [player, server]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="cmake ninja-build clang"
          if [ "${{ matrix.application }}" = player ]; then
            packages="$packages ca-certificates $DISPLAY_DEV_PACKAGES"
          fi
          apt-get update && apt-get install -y --no-install-recommends $packages
      - name: Configure
        run: cmake --preset linux-shipping-${{ matrix.application }}
      - name: Build
        run: cmake --build --preset linux-shipping-${{ matrix.application }}
      - name: Run
        run: ./build/linux-shipping-${{ matrix.application }}/bin/Release/minimal_${{ matrix.application }}
      - name: Run window_player headless
        if: matrix.application == 'player'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ./build/linux-shipping-player/bin/Release/window_player --frames 10
